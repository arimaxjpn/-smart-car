<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart Car">
  <title>Smart Car</title>
  <style>
    :root {
      --bg:     #1c1c1e;
      --bg2:    #2c2c2e;
      --bg3:    #3a3a3c;
      --accent: #0a84ff;
      --green:  #30d158;
      --red:    #ff453a;
      --yellow: #ffd60a;
      --text:   #ffffff;
      --text2:  rgba(235,235,245,0.6);
      --r:      12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100svh;
    }

    /* ---- 共通 ---- */
    .screen { display: none; }
    .screen.active { display: block; }

    h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .sub { color: var(--text2); font-size: 14px; margin-bottom: 24px; }

    .card { background: var(--bg2); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
    .card-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }

    input[type="text"] {
      width: 100%; background: var(--bg3); border: 1.5px solid transparent;
      border-radius: 10px; padding: 14px; color: var(--text);
      font-size: 17px; outline: none; -webkit-appearance: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%; border: none; border-radius: var(--r);
      padding: 17px; font-size: 17px; font-weight: 600;
      cursor: pointer; -webkit-appearance: none; transition: opacity .15s;
    }
    .btn:disabled { opacity: 0.4; }
    .btn-blue  { background: var(--accent); color: #fff; }
    .btn-red   { background: var(--red);    color: #fff; }
    .btn-gray  { background: var(--bg3);    color: var(--text2); }

    /* ---- ローディング ---- */
    #screen-loading {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; min-height: 100svh;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--bg3); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- セットアップ ---- */
    #screen-setup.active { display: flex; align-items: center; justify-content: center; min-height: 100svh; }
    #screen-setup .inner { padding: 24px; max-width: 440px; width: 100%; }
    #screen-setup h1 { margin-bottom: 6px; }

    /* ---- ステータスバー ---- */
    .status-bar {
      background: var(--bg2); padding: 14px 20px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--bg3);
      position: sticky; top: 0; z-index: 10;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot-green  { background: var(--green); }
    .dot-yellow { background: var(--yellow); }
    .status-label { font-size: 14px; font-weight: 500; }

    /* ---- スマホ最適化：乗車・降車画面 ---- */
    #screen-start.active, #screen-end.active {
      display: flex; flex-direction: column; height: 100svh;
    }
    #screen-start .content, #screen-end .content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .btn-area { padding: 12px 20px 36px; flex-shrink: 0; background: var(--bg); }
    .card-expand { flex: 1; display: flex; flex-direction: column; }

    /* ---- コンテンツ ---- */
    .content { padding: 20px 20px 0; }

    /* ---- 目的ボタン ---- */
    .purpose-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .purpose-btn {
      background: var(--bg3); border: 2px solid transparent;
      border-radius: 10px; padding: 14px 4px;
      color: var(--text); font-size: 13px; font-weight: 500;
      cursor: pointer; text-align: center;
      transition: all .15s; -webkit-appearance: none;
    }
    .purpose-btn.selected { background: rgba(10,132,255,.18); border-color: var(--accent); color: var(--accent); }
    .purpose-btn.full { grid-column: 1 / -1; }
    #other-input { margin-top: 10px; }

    /* ---- 写真 ---- */
    .photo-tap {
      background: var(--bg3); border-radius: 10px; min-height: 130px; flex: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px; cursor: pointer;
      color: var(--text2); font-size: 13px;
    }
    .photo-tap:active { opacity: .7; }
    .photo-icon { font-size: 32px; }
    .retake-overlay {
      position: absolute; bottom: 10px; right: 10px;
      background: rgba(0,0,0,0.6); color: #fff;
      border: none; border-radius: 8px;
      padding: 6px 12px; font-size: 13px;
      cursor: pointer; -webkit-appearance: none;
    }
    input[type="file"] { display: none; }

    /* ---- 乗車情報 ---- */
    .info-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 7px 0; border-bottom: 1px solid var(--bg3); font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-key { color: var(--text2); }
    .info-val { font-weight: 500; text-align: right; max-width: 65%; font-size: 13px; }

    /* ---- 結果 ---- */
    #screen-result {
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 18px; min-height: 100svh;
      padding: 40px; text-align: center;
    }
    #screen-result.active { display: flex; }
    .result-icon  { font-size: 68px; }
    .result-title { font-size: 22px; font-weight: 700; }
    .result-sub   { color: var(--text2); font-size: 15px; }

    /* ---- カメラモーダル ---- */
    #cam-modal {
      display: none; position: fixed; inset: 0; background: #000; z-index: 200;
      flex-direction: column;
    }
    #cam-modal.active { display: flex; }
    #cam-video-wrap { flex: 1; position: relative; overflow: hidden; }
    #cam-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #cam-guide {
      position: absolute;
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
      pointer-events: none;
    }
    #cam-guide-label {
      position: absolute; top: -26px; left: 0;
      color: #fff; font-size: 12px;
      background: rgba(0,0,0,0.6); padding: 3px 8px; border-radius: 4px;
      pointer-events: none;
    }
    #cam-controls {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 40px 44px; background: #000;
    }
    .cam-shutter {
      width: 72px; height: 72px; border-radius: 50%;
      background: #fff; border: 5px solid rgba(255,255,255,0.4);
      cursor: pointer; -webkit-appearance: none; flex-shrink: 0;
    }
    .cam-cancel-btn {
      color: #fff; font-size: 16px; background: none; border: none;
      cursor: pointer; padding: 8px; min-width: 72px;
    }

    /* ---- トースト ---- */
    .toast {
      position: fixed; bottom: 36px; left: 50%;
      transform: translateX(-50%); background: rgba(0,0,0,.85);
      color: #fff; padding: 11px 22px; border-radius: 20px;
      font-size: 14px; opacity: 0; transition: opacity .3s;
      pointer-events: none; white-space: nowrap; z-index: 100;
    }
    .toast.show { opacity: 1; }

  </style>
</head>
<body>

<!-- ローディング -->
<div id="screen-loading">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:14px;">接続中...</div>
</div>

<!-- セットアップ -->
<div id="screen-setup" class="screen">
  <div class="inner">
    <h1>初回設定</h1>
    <p class="sub" style="margin-bottom:32px;">認証トークンを入力してください<br>（設定シート B6 の値）</p>
    <div class="card">
      <div class="card-label">認証トークン</div>
      <input type="text" id="input-token" placeholder="32文字のトークン" autocomplete="off" />
    </div>
    <button class="btn btn-blue" onclick="saveSetup()" style="margin-top:8px;">保存して開始</button>
  </div>
</div>

<!-- 乗車画面 -->
<div id="screen-start" class="screen">
  <div class="status-bar">
    <div class="dot dot-green"></div>
    <div class="status-label">乗車前</div>
  </div>
  <div class="content">
    <h1>🚗 乗車記録 <span style="font-size:12px;color:var(--text2);font-weight:400;">03/01-C</span></h1>
    <p class="sub">出発時のメーターを撮影します</p>

    <div class="card">
      <div class="card-label">現在地情報</div>
      <div id="start-info"></div>
    </div>

    <div class="card card-expand">
      <div class="card-label">メーター写真</div>
      <div class="photo-tap" id="photo-tap-start" onclick="openCamera('start')">
        <span class="photo-icon">📷</span>
        <span>タップして撮影</span>
        <span style="font-size:11px;margin-top:2px;">ダッシュボード全体を枠に合わせて</span>
      </div>
      <div id="photo-wrap-start" style="position:relative; display:none; margin-top:10px;">
        <img id="photo-preview-start" style="width:100%; border-radius:10px;" />
        <button class="retake-overlay" onclick="retakePhoto('start')">📷 取り直し</button>
      </div>
      <input type="file" id="cam-file-start" accept="image/*" capture="environment" onchange="handlePhoto(this,'photo-preview-start')" style="display:none;">
    </div>

  </div>
  <div class="btn-area">
    <div id="purpose-btns">
      <div style="font-size:12px;color:var(--text2);text-align:center;margin-bottom:10px;">業務目的を選んで記録開始</div>
      <div class="purpose-grid">
        <button class="purpose-btn" onclick="selectAndSubmit(this,'現場移動')">現場移動</button>
        <button class="purpose-btn" onclick="selectAndSubmit(this,'前日乗り込み')">前日乗り込み</button>
        <button class="purpose-btn" onclick="showOtherInput()">その他</button>
      </div>
    </div>
    <div id="other-area" style="display:none;">
      <input type="text" id="other-input" placeholder="業務目的を入力" style="margin-bottom:8px;" />
      <button class="btn btn-blue" onclick="submitStart()">記録開始</button>
    </div>
  </div>
</div>

<!-- 降車画面 -->
<div id="screen-end" class="screen">
  <div class="status-bar">
    <div class="dot dot-yellow"></div>
    <div class="status-label">走行中</div>
  </div>
  <div class="content">
    <h1>🏁 降車記録</h1>
    <p class="sub">到着時のメーターを撮影します</p>

    <div class="card">
      <div class="card-label">乗車情報</div>
      <div id="trip-info"></div>
    </div>

    <div class="card card-expand">
      <div class="card-label">メーター写真</div>
      <div class="photo-tap" id="photo-tap-end" onclick="openCamera('end')">
        <span class="photo-icon">📷</span>
        <span>タップして撮影</span>
        <span style="font-size:11px;margin-top:2px;">ダッシュボード全体を枠に合わせて</span>
      </div>
      <div id="photo-wrap-end" style="position:relative; display:none; margin-top:10px;">
        <img id="photo-preview-end" style="width:100%; border-radius:10px;" />
        <button class="retake-overlay" onclick="retakePhoto('end')">📷 取り直し</button>
      </div>
      <input type="file" id="cam-file-end" accept="image/*" capture="environment" onchange="handlePhoto(this,'photo-preview-end')" style="display:none;">
    </div>

  </div>
  <div class="btn-area">
    <button class="btn btn-red" onclick="submitEnd()">降車記録</button>
  </div>
</div>

<!-- 結果 -->
<div id="screen-result">
  <div class="result-icon">✅</div>
  <div class="result-title" id="result-title"></div>
  <div class="result-sub"   id="result-sub"></div>
  <button class="btn btn-gray" onclick="restart()" style="margin-top:12px; width:auto; padding:14px 40px;">完了</button>
</div>

<!-- カメラモーダル -->
<div id="cam-modal">
  <div id="cam-video-wrap">
    <video id="cam-video" autoplay playsinline muted></video>
    <div id="cam-guide">
      <div id="cam-guide-label">ODOメーターを枠に合わせて</div>
    </div>
  </div>
  <div id="cam-controls">
    <button class="cam-cancel-btn" onclick="closeCamera()">キャンセル</button>
    <button class="cam-shutter" onclick="capturePhoto()"></button>
    <div style="min-width:72px"></div>
  </div>
</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

<script>
const GAS_URL   = 'https://script.google.com/macros/s/AKfycbzSPja787LxEq4DyC74h62l0Zyac-wi8ZVQEdJIUnF6qTwYUh_ohODj0CkxbulH-L9h/exec';
const TOKEN_KEY = 'smartcar_token';

let currentTrip     = null;
let selectedPurpose = '';
let photoBase64Start = '';
let photoBase64End   = '';
let locationPromise  = null;

// ---- 停車検知・アラーム ----
let audioCtx      = null;
let stopWatchId   = null;
let stopTimer     = null;
let alarmTimer    = null;
let isAlarmActive = false;

document.addEventListener('touchstart', () => {
  ensureAudio();
  if (isAlarmActive) stopAlarmOnly();
}, { passive: true });

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    ensureAudio();
    if (isAlarmActive) stopAlarmOnly();
  }
});

function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}

function startStopWatch() {
  if (!navigator.geolocation) return;
  stopStopWatch();
  stopWatchId = navigator.geolocation.watchPosition(
    pos => {
      const speed = pos.coords.speed;
      const kmh   = speed !== null ? speed * 3.6 : null;
      if (kmh !== null && kmh < 3) {
        if (!stopTimer && !isAlarmActive) {
          stopTimer = setTimeout(playArrivalAlarm, 60 * 1000);
        }
      } else if (kmh !== null && kmh >= 3) {
        clearTimeout(stopTimer); stopTimer = null;
      }
    },
    () => {},
    { enableHighAccuracy: true, timeout: 30000, maximumAge: 3000 }
  );
}

function stopStopWatch() {
  if (stopWatchId !== null) { navigator.geolocation.clearWatch(stopWatchId); stopWatchId = null; }
  clearTimeout(stopTimer); stopTimer = null;
  stopAlarmOnly();
}

function stopAlarmOnly() {
  isAlarmActive = false;
  clearTimeout(alarmTimer); alarmTimer = null;
  clearTimeout(stopTimer);  stopTimer  = null;
}

function playArrivalAlarm() {
  isAlarmActive = true;
  ensureAudio();
  function beep() {
    if (!isAlarmActive || !audioCtx) return;
    try {
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.4);
    } catch(e) {}
    if (isAlarmActive) alarmTimer = setTimeout(beep, 2000);
  }
  beep();
}

// ---- カメラ ----
let activeCameraTarget = '';
let cameraStream = null;
const GUIDE_RATIO = 1.9;

async function openCamera(target) {
  activeCameraTarget = target;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    document.getElementById('cam-file-' + target).click(); return;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    document.getElementById('cam-video').srcObject = cameraStream;
    document.getElementById('cam-modal').classList.add('active');
    setTimeout(positionGuide, 120);
  } catch(e) {
    document.getElementById('cam-file-' + target).click();
  }
}

function positionGuide() {
  const wrap  = document.getElementById('cam-video-wrap');
  const guide = document.getElementById('cam-guide');
  const wW = wrap.clientWidth;
  const wH = wrap.clientHeight;
  const gW = Math.round(wW * 0.55);
  const gH = Math.round(gW / GUIDE_RATIO);
  const gX = Math.round((wW - gW) / 2);
  const gY = Math.round((wH - gH) / 2);
  guide.style.left   = gX + 'px';
  guide.style.top    = gY + 'px';
  guide.style.width  = gW + 'px';
  guide.style.height = gH + 'px';
}

function closeCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  document.getElementById('cam-modal').classList.remove('active');
}

function capturePhoto() {
  const video = document.getElementById('cam-video');
  const wrap  = document.getElementById('cam-video-wrap');
  const guide = document.getElementById('cam-guide');
  const gX = parseInt(guide.style.left),  gY = parseInt(guide.style.top);
  const gW = parseInt(guide.style.width), gH = parseInt(guide.style.height);
  const wW = wrap.clientWidth, wH = wrap.clientHeight;
  const vW = video.videoWidth,  vH = video.videoHeight;
  const cAsp = wW / wH, vAsp = vW / vH;
  let scale, offX, offY;
  if (vAsp > cAsp) { scale = wH / vH; offX = (wW - vW * scale) / 2; offY = 0; }
  else             { scale = wW / vW; offX = 0; offY = (wH - vH * scale) / 2; }
  const cx = Math.max(0, Math.round((gX - offX) / scale));
  const cy = Math.max(0, Math.round((gY - offY) / scale));
  const cw = Math.min(Math.round(gW / scale), vW - cx);
  const ch = Math.min(Math.round(gH / scale), vH - cy);
  const MAX_W = 1024;
  const s = cw > MAX_W ? MAX_W / cw : 1;
  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(cw * s);
  canvas.height = Math.round(ch * s);
  canvas.getContext('2d').drawImage(video, cx, cy, cw, ch, 0, 0, canvas.width, canvas.height);
  closeCamera();
  processCanvas(canvas, 'photo-preview-' + activeCameraTarget);
}

window.addEventListener('resize', () => {
  if (document.getElementById('cam-modal').classList.contains('active')) positionGuide();
});

// ---- 画面切替 ----
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('screen-' + id);
  if (id === 'result') {
    el.style.display = 'flex';
    el.classList.add('active');
  } else if (el) {
    el.classList.add('active');
  }
  document.getElementById('screen-loading').style.display = 'none';
}

// ---- トースト ----
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ---- トークン ----
function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

// ---- 位置情報（バックグラウンド取得） ----
function startLocationAcquisition() {
  locationPromise = new Promise(resolve => {
    if (!navigator.geolocation) { resolve({ lat: '', lon: '', address: '' }); return; }
    navigator.geolocation.getCurrentPosition(
      async p => {
        const lat = p.coords.latitude, lon = p.coords.longitude;
        const address = await getAddress(lat, lon);
        resolve({ lat, lon, address });
      },
      () => resolve({ lat: '', lon: '', address: '' }),
      { timeout: 15000, maximumAge: 30000 }
    );
  });
}

// ---- 初期化 ----
async function init() {
  document.getElementById('screen-loading').style.display = 'flex';
  if (!getToken()) { show('setup'); return; }
  try {
    const res  = await fetch(GAS_URL + '?action=status&token=' + getToken());
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    if (json.hasOpenTrip) {
      currentTrip = json;
      buildTripInfo();
      startLocationAcquisition();
      show('end');
      startStopWatch();
    } else {
      currentTrip = null;
      resetStart();
      show('start');
    }
  } catch(e) {
    toast('接続エラー: ' + e.message);
    show('setup');
  }
}

function saveSetup() {
  const token = document.getElementById('input-token').value.trim();
  if (!token) { toast('トークンを入力してください'); return; }
  localStorage.setItem(TOKEN_KEY, token);
  init();
}

// ---- 乗車画面 ----
function buildStartInfo() {
  const now = new Date();
  const timeStr = now.toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
  document.getElementById('start-info').innerHTML =
    '<div class="info-row"><span class="info-key">現在時刻</span><span class="info-val">' + timeStr + '</span></div>' +
    '<div class="info-row"><span class="info-key">現在地</span><span class="info-val" id="start-address">取得中...</span></div>';
  if (locationPromise) {
    locationPromise.then(loc => {
      const el = document.getElementById('start-address');
      if (el) el.textContent = loc.address || '取得できませんでした';
    });
  }
}

function resetStart() {
  selectedPurpose  = '';
  photoBase64Start = '';
  document.querySelectorAll('.purpose-btn').forEach(b => { b.classList.remove('selected'); b.disabled = false; });
  document.getElementById('purpose-btns').style.display = 'block';
  document.getElementById('other-area').style.display = 'none';
  document.getElementById('other-input').value = '';
  const prev = document.getElementById('photo-preview-start');
  prev.src = '';
  document.getElementById('photo-wrap-start').style.display = 'none';
  document.getElementById('photo-tap-start').style.display = 'flex';
  startLocationAcquisition();
  buildStartInfo();
}

async function selectAndSubmit(btn, purpose) {
  if (!photoBase64Start) { toast('写真を撮影してください'); return; }
  selectedPurpose = purpose;
  document.querySelectorAll('#purpose-btns .purpose-btn').forEach(b => b.disabled = true);
  const origText = btn.textContent;
  btn.textContent = '送信中...';
  try {
    await doSubmitStart(purpose);
  } catch(e) {
    toast('エラー: ' + e.message);
    document.querySelectorAll('#purpose-btns .purpose-btn').forEach(b => b.disabled = false);
    btn.textContent = origText;
  }
}

function showOtherInput() {
  document.getElementById('purpose-btns').style.display = 'none';
  document.getElementById('other-area').style.display = 'block';
  document.getElementById('other-input').focus();
}

function handlePhoto(input, previewId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX_W = 1024;
      const scale = img.width > MAX_W ? MAX_W / img.width : 1;
      const canvas = document.createElement('canvas');
      canvas.width  = Math.round(img.width  * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      processCanvas(canvas, previewId);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function processCanvas(canvas, previewId) {
  const b64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
  if (previewId === 'photo-preview-start') photoBase64Start = b64;
  else photoBase64End = b64;
  const prev = document.getElementById(previewId);
  prev.src = canvas.toDataURL('image/jpeg', 0.85);
  const target = previewId === 'photo-preview-start' ? 'start' : 'end';
  document.getElementById('photo-tap-' + target).style.display = 'none';
  document.getElementById('photo-wrap-' + target).style.display = 'block';
}

function retakePhoto(target) {
  if (target === 'start') photoBase64Start = '';
  else photoBase64End = '';
  const prev = document.getElementById('photo-preview-' + target);
  prev.src = '';
  document.getElementById('photo-wrap-' + target).style.display = 'none';
  document.getElementById('photo-tap-' + target).style.display = 'flex';
  openCamera(target);
}

async function getAddress(lat, lon) {
  if (!lat || !lon) return '';
  try {
    const res = await fetch(
      'https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lon + '&format=json&accept-language=ja',
      { headers: { 'Accept-Language': 'ja' } }
    );
    const json = await res.json();
    const a = json.address || {};
    const parts = [
      a.state,
      a.city || a.town || a.village || a.county,
      a.suburb || a.neighbourhood || a.quarter,
      a.road,
      a.house_number
    ].filter(Boolean);
    return parts.join('');
  } catch(e) {
    return '';
  }
}

async function doSubmitStart(purpose) {
  const loc = await locationPromise;
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({
      token: getToken(), type: 'start',
      datetime: new Date().toISOString(),
      lat: loc.lat, lon: loc.lon, address: loc.address,
      purpose: purpose,
      photo: photoBase64Start
    })
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.error);
  showResult('乗車記録完了', '降車時にアプリを開いてください');
}

async function submitStart() {
  const purpose = document.getElementById('other-input').value.trim();
  if (!purpose) { toast('目的を入力してください'); return; }
  if (!photoBase64Start) { toast('写真を撮影してください'); return; }
  const btn = document.querySelector('#other-area .btn-blue');
  btn.disabled = true; btn.textContent = '送信中...';
  try {
    await doSubmitStart(purpose);
  } catch(e) {
    toast('エラー: ' + e.message);
    btn.disabled = false; btn.textContent = '記録開始';
  }
}

// ---- 降車画面 ----
function buildTripInfo() {
  const t = currentTrip;
  const startTime = t.startDatetime
    ? new Date(t.startDatetime).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
    : '不明';
  const addressRow = t.startAddress
    ? '<div class="info-row"><span class="info-key">乗車地</span><span class="info-val">' + t.startAddress + '</span></div>'
    : '';
  document.getElementById('trip-info').innerHTML =
    '<div class="info-row"><span class="info-key">乗車時刻</span><span class="info-val">' + startTime + '</span></div>' +
    addressRow;
}

async function submitEnd() {
  if (!photoBase64End) { toast('写真を撮影してください'); return; }

  const btn = document.querySelector('#screen-end .btn-red');
  btn.disabled = true; btn.textContent = '位置情報取得中...';

  const loc = await locationPromise;
  btn.textContent = '送信中...';
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        token: getToken(), type: 'end',
        tripId: currentTrip.tripId,
        datetime: new Date().toISOString(),
        lat: loc.lat, lon: loc.lon, address: loc.address,
        photo: photoBase64End
      })
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    stopStopWatch();
    showResult('降車記録完了', '記録しました');
  } catch(e) {
    toast('エラー: ' + e.message);
    btn.disabled = false; btn.textContent = '降車記録';
  }
}

// ---- 結果 ----
function showResult(title, sub) {
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-sub').textContent   = sub;
  document.getElementById('screen-result').style.display = 'flex';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
}

function restart() {
  document.getElementById('screen-result').style.display = 'none';
  init();
}

// ---- 起動 ----
init();
</script>
