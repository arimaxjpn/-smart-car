<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart Car">
  <title>Smart Car</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0a0c10;
      --bg2:     #12151c;
      --bg3:     #1a1e28;
      --accent:  #2560dd;
      --green:   #139c5c;
      --red:     #da2c4e;
      --yellow:  #c57f00;
      --text:    #f0f2f5;
      --text2:   #8a93a8;
      --text3:   #4a5168;
      --border:  #ffffff14;
      --border2: #ffffff28;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Outfit', 'IBM Plex Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100svh;
    }

    /* ---- 共通 ---- */
    .screen { display: none; }
    .screen.active { display: block; }

    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.25rem; }
    .sub { color: var(--text2); font-size: 0.875rem; margin-bottom: 1.5rem; }

    .card {
      background: var(--bg2); border-radius: 20px; padding: 1.5rem;
      margin-bottom: 0.75rem; border: 1px solid var(--border);
    }
    .card-label { font-size: 0.75rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 0.625rem; font-weight: 600; }

    input[type="text"] {
      width: 100%; background: var(--bg2); border: 1px solid var(--border2);
      border-radius: 12px; padding: 0.75rem 1rem; color: var(--text);
      font-family: 'Outfit', 'IBM Plex Sans JP', sans-serif;
      font-size: 1.0625rem; outline: none; -webkit-appearance: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #2560dd33; }

    .btn {
      width: 100%; border: none; border-radius: 9999px;
      padding: 1rem 1.5rem; font-size: 1.0625rem; font-weight: 700;
      font-family: 'Outfit', 'IBM Plex Sans JP', sans-serif;
      cursor: pointer; -webkit-appearance: none; transition: opacity .15s;
    }
    .btn:disabled { opacity: 0.4; }
    .btn-blue  { background: var(--accent); color: #fff; }
    .btn-red   { background: var(--red);    color: #fff; }

    /* ---- ローディング ---- */
    #screen-loading {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem; min-height: 100svh;
    }
    .spinner {
      width: 2.25rem; height: 2.25rem;
      border: 3px solid var(--bg3); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- セットアップ ---- */
    #screen-setup.active { display: flex; align-items: center; justify-content: center; min-height: 100svh; }
    #screen-setup .inner { padding: 1.5rem; max-width: 440px; width: 100%; }
    #screen-setup h1 { margin-bottom: 0.375rem; }

    /* ---- ステータスバー ---- */
    .status-bar {
      background: var(--bg2); padding: 0.875rem 1.25rem;
      display: flex; align-items: center; gap: 0.625rem;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; }
    .dot-green  { background: var(--green); }
    .dot-yellow { background: var(--yellow); }
    .status-label { font-size: 0.875rem; font-weight: 600; }

    /* ---- スマホ最適化：乗車・降車画面 ---- */
    #screen-start.active, #screen-end.active {
      display: flex; flex-direction: column; height: 100svh;
    }
    #screen-start .content, #screen-end .content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .btn-area { padding: 0.75rem 1.25rem 2.25rem; flex-shrink: 0; background: var(--bg); }
    .card-expand { flex: 1; display: flex; flex-direction: column; }

    /* ---- コンテンツ ---- */
    .content { padding: 1.25rem 1.25rem 0; }

    /* ---- 目的ボタン ---- */
    .purpose-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
    .purpose-btn {
      background: var(--bg3); border: 2px solid transparent;
      border-radius: 9999px; padding: 0.75rem 0.25rem;
      color: var(--text); font-size: 0.8125rem; font-weight: 600;
      font-family: 'Outfit', 'IBM Plex Sans JP', sans-serif;
      cursor: pointer; text-align: center;
      transition: all .15s; -webkit-appearance: none;
    }
    .purpose-btn.selected { background: #2560dd1a; border-color: var(--accent); color: var(--accent); }

    /* ---- 写真 ---- */
    .photo-tap {
      background: var(--bg3); border-radius: 12px; min-height: 8rem; flex: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 0.5rem; cursor: pointer;
      color: var(--text2); font-size: 0.8125rem;
      border: 1px dashed var(--border2);
    }
    .photo-tap:active { opacity: .7; }
    .photo-icon { font-size: 2rem; }
    .retake-overlay {
      position: absolute; bottom: 0.625rem; right: 0.625rem;
      background: rgba(0,0,0,0.6); color: #fff;
      border: none; border-radius: 9999px;
      padding: 0.375rem 0.75rem; font-size: 0.8125rem;
      font-family: 'Outfit', 'IBM Plex Sans JP', sans-serif;
      cursor: pointer; -webkit-appearance: none;
    }
    input[type="file"] { display: none; }

    /* ---- カメラモーダル ---- */
    #cam-modal {
      display: none; position: fixed; inset: 0; background: #000; z-index: 200;
      flex-direction: column;
    }
    #cam-modal.active { display: flex; }
    #cam-video-wrap { flex: 1; position: relative; overflow: hidden; }
    #cam-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #cam-guide {
      position: absolute;
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
      pointer-events: none;
    }
    #cam-guide-label {
      position: absolute; top: -1.625rem; left: 0;
      color: #fff; font-size: 0.75rem;
      font-family: 'Outfit', 'IBM Plex Sans JP', sans-serif;
      background: rgba(0,0,0,0.6); padding: 0.1875rem 0.5rem; border-radius: 0.25rem;
      pointer-events: none;
    }
    #cam-controls {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 2.5rem 2.75rem; background: #000;
    }
    .cam-shutter {
      width: 4.5rem; height: 4.5rem; border-radius: 50%;
      background: #fff; border: 5px solid rgba(255,255,255,0.4);
      cursor: pointer; -webkit-appearance: none; flex-shrink: 0;
    }
    .cam-cancel-btn {
      color: #fff; font-size: 1rem; background: none; border: none;
      font-family: 'Outfit', 'IBM Plex Sans JP', sans-serif;
      cursor: pointer; padding: 0.5rem; min-width: 4.5rem;
    }

    /* ---- トースト ---- */
    .toast {
      position: fixed; bottom: 2.25rem; left: 50%;
      transform: translateX(-50%); background: var(--bg3);
      color: var(--text); padding: 0.6875rem 1.375rem; border-radius: 9999px;
      font-size: 0.875rem; opacity: 0; transition: opacity .3s;
      pointer-events: none; white-space: nowrap; z-index: 100;
      border: 1px solid var(--border);
    }
    .toast.show { opacity: 1; }

  </style>
</head>
<body>

<!-- ローディング -->
<div id="screen-loading">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:0.875rem;">接続中...</div>
</div>

<!-- セットアップ -->
<div id="screen-setup" class="screen">
  <div class="inner">
    <h1>初回設定</h1>
    <p class="sub" style="margin-bottom:2rem;">認証トークンを入力してください<br>（設定シート B6 の値）</p>
    <div class="card">
      <div class="card-label">認証トークン</div>
      <input type="text" id="input-token" placeholder="32文字のトークン" autocomplete="off" />
    </div>
    <button class="btn btn-blue" onclick="saveSetup()" style="margin-top:0.5rem;">保存して開始</button>
  </div>
</div>

<!-- 乗車画面 -->
<div id="screen-start" class="screen">
  <div class="status-bar">
    <div class="dot dot-green"></div>
    <div class="status-label">乗車前</div>
  </div>
  <div class="content">
    <h1>🚗 乗車記録 <span id="app-version" style="font-size:0.75rem;color:var(--text2);font-weight:400;"></span></h1>

    <div class="card">
      <div id="start-info"></div>
    </div>

    <div class="card card-expand">
      <div class="photo-tap" id="photo-tap-start" onclick="openCamera('start')">
        <span class="photo-icon">📷</span>
      </div>
      <div id="photo-wrap-start" style="position:relative; display:none; margin-top:0.625rem;">
        <img id="photo-preview-start" style="width:100%; border-radius:0.75rem;" />
        <button class="retake-overlay" onclick="retakePhoto('start')">📷 取り直し</button>
      </div>
      <input type="file" id="cam-file-start" accept="image/*" capture="environment" onchange="handlePhoto(this,'photo-preview-start')" style="display:none;">
    </div>

  </div>
  <div class="btn-area">
    <div id="purpose-btns">
      <div class="purpose-grid">
        <button class="purpose-btn" data-label="現場移動" onclick="selectAndSubmit(this,'現場移動')">現場移動</button>
        <button class="purpose-btn" data-label="出張移動" onclick="selectAndSubmit(this,'出張移動')">出張移動</button>
        <button class="purpose-btn" data-label="運搬移動" onclick="selectAndSubmit(this,'運搬移動')">運搬移動</button>
      </div>
    </div>
  </div>
</div>

<!-- 降車画面 -->
<div id="screen-end" class="screen">
  <div class="status-bar">
    <div class="dot dot-yellow"></div>
    <div class="status-label">走行中</div>
  </div>
  <div class="content">
    <h1>🏁 降車記録 <span id="app-version-end" style="font-size:0.75rem;color:var(--text2);font-weight:400;"></span></h1>

    <div class="card">
      <div id="trip-info"></div>
    </div>

    <div class="card card-expand">
      <div class="photo-tap" id="photo-tap-end" onclick="openCamera('end')">
        <span class="photo-icon">📷</span>
      </div>
      <div id="photo-wrap-end" style="position:relative; display:none; margin-top:0.625rem;">
        <img id="photo-preview-end" style="width:100%; border-radius:0.75rem;" />
        <button class="retake-overlay" onclick="retakePhoto('end')">📷 取り直し</button>
      </div>
      <input type="file" id="cam-file-end" accept="image/*" capture="environment" onchange="handlePhoto(this,'photo-preview-end')" style="display:none;">
    </div>

  </div>
  <div class="btn-area">
    <button class="btn btn-red" onclick="submitEnd()">降車記録</button>
  </div>
</div>


<!-- カメラモーダル -->
<div id="cam-modal">
  <div id="cam-video-wrap">
    <video id="cam-video" autoplay playsinline muted></video>
    <div id="cam-guide">
      <div id="cam-guide-label">ODOメーターを枠に合わせて</div>
    </div>
  </div>
  <div id="cam-controls">
    <button class="cam-cancel-btn" onclick="closeCamera()">キャンセル</button>
    <button class="cam-shutter" onclick="capturePhoto()"></button>
    <div style="min-width:4.5rem"></div>
  </div>
</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

<script>
const _VERSION  = 'v1.2';
const GAS_URL   = 'https://script.google.com/macros/s/AKfycbzSPja787LxEq4DyC74h62l0Zyac-wi8ZVQEdJIUnF6qTwYUh_ohODj0CkxbulH-L9h/exec';
const TOKEN_KEY = 'smartcar_token';

let currentTrip      = null;
let photoBase64Start = '';
let photoBase64End   = '';
let locationPromise  = null;

// ---- 停車検知・アラーム ----
let audioCtx      = null;
let stopWatchId   = null;
let stopTimer     = null;
let alarmTimer    = null;
let isAlarmActive = false;

document.addEventListener('touchstart', () => {
  ensureAudio();
  if (isAlarmActive) stopAlarmOnly();
}, { passive: true });

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    ensureAudio();
    if (isAlarmActive) stopAlarmOnly();
  }
});

function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}

function startStopWatch() {
  if (!navigator.geolocation) return;
  stopStopWatch();
  stopWatchId = navigator.geolocation.watchPosition(
    pos => {
      const speed = pos.coords.speed;
      const kmh   = speed !== null ? speed * 3.6 : null;
      if (kmh !== null && kmh < 3) {
        if (!stopTimer && !isAlarmActive) {
          stopTimer = setTimeout(playArrivalAlarm, 60 * 1000);
        }
      } else if (kmh !== null && kmh >= 3) {
        clearTimeout(stopTimer); stopTimer = null;
      }
    },
    () => {},
    { enableHighAccuracy: true, timeout: 30000, maximumAge: 3000 }
  );
}

function stopStopWatch() {
  if (stopWatchId !== null) { navigator.geolocation.clearWatch(stopWatchId); stopWatchId = null; }
  clearTimeout(stopTimer); stopTimer = null;
  stopAlarmOnly();
}

function stopAlarmOnly() {
  isAlarmActive = false;
  clearTimeout(alarmTimer); alarmTimer = null;
  clearTimeout(stopTimer);  stopTimer  = null;
}

function playArrivalAlarm() {
  isAlarmActive = true;
  ensureAudio();
  function beep() {
    if (!isAlarmActive || !audioCtx) return;
    try {
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.4);
    } catch(e) {}
    if (isAlarmActive) alarmTimer = setTimeout(beep, 2000);
  }
  beep();
}

// ---- カメラ ----
let activeCameraTarget = '';
let cameraStream = null;
const GUIDE_RATIO = 1.9;

async function openCamera(target) {
  activeCameraTarget = target;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    document.getElementById('cam-file-' + target).click(); return;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    document.getElementById('cam-video').srcObject = cameraStream;
    document.getElementById('cam-modal').classList.add('active');
    setTimeout(positionGuide, 120);
  } catch(e) {
    document.getElementById('cam-file-' + target).click();
  }
}

function positionGuide() {
  const wrap  = document.getElementById('cam-video-wrap');
  const guide = document.getElementById('cam-guide');
  const wW = wrap.clientWidth;
  const wH = wrap.clientHeight;
  const gW = Math.round(wW * 0.58);
  const gH = Math.round(gW / GUIDE_RATIO);
  const gX = Math.round((wW - gW) / 2);
  const gY = Math.round((wH - gH) / 2);
  guide.style.left   = gX + 'px';
  guide.style.top    = gY + 'px';
  guide.style.width  = gW + 'px';
  guide.style.height = gH + 'px';
}

function closeCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  document.getElementById('cam-modal').classList.remove('active');
}

function capturePhoto() {
  const video = document.getElementById('cam-video');
  const wrap  = document.getElementById('cam-video-wrap');
  const guide = document.getElementById('cam-guide');
  const gX = parseInt(guide.style.left),  gY = parseInt(guide.style.top);
  const gW = parseInt(guide.style.width), gH = parseInt(guide.style.height);
  const wW = wrap.clientWidth, wH = wrap.clientHeight;
  const vW = video.videoWidth,  vH = video.videoHeight;
  const cAsp = wW / wH, vAsp = vW / vH;
  let scale, offX, offY;
  if (vAsp > cAsp) { scale = wH / vH; offX = (wW - vW * scale) / 2; offY = 0; }
  else             { scale = wW / vW; offX = 0; offY = (wH - vH * scale) / 2; }
  const cx = Math.max(0, Math.round((gX - offX) / scale));
  const cy = Math.max(0, Math.round((gY - offY) / scale));
  const cw = Math.min(Math.round(gW / scale), vW - cx);
  const ch = Math.min(Math.round(gH / scale), vH - cy);
  const MAX_W = 1024;
  const s = cw > MAX_W ? MAX_W / cw : 1;
  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(cw * s);
  canvas.height = Math.round(ch * s);
  canvas.getContext('2d').drawImage(video, cx, cy, cw, ch, 0, 0, canvas.width, canvas.height);
  closeCamera();
  processCanvas(canvas, 'photo-preview-' + activeCameraTarget);
}

window.addEventListener('resize', () => {
  if (document.getElementById('cam-modal').classList.contains('active')) positionGuide();
});

// ---- 画面切替 ----
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('screen-' + id);
  if (el) el.classList.add('active');
  document.getElementById('screen-loading').style.display = 'none';
}

// ---- トースト ----
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ---- トークン ----
function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

// ---- 位置情報（バックグラウンド取得） ----
function startLocationAcquisition() {
  locationPromise = new Promise(resolve => {
    if (!navigator.geolocation) { resolve({ lat: '', lon: '', address: '' }); return; }
    navigator.geolocation.getCurrentPosition(
      async p => {
        const lat = p.coords.latitude, lon = p.coords.longitude;
        const address = await getAddress(lat, lon);
        resolve({ lat, lon, address });
      },
      () => resolve({ lat: '', lon: '', address: '' }),
      { timeout: 15000, maximumAge: 30000 }
    );
  });
}

// ---- 初期化 ----
async function init() {
  document.getElementById('app-version').textContent = _VERSION;
  document.getElementById('app-version-end').textContent = _VERSION;
  document.getElementById('screen-loading').style.display = 'flex';
  if (!getToken()) { show('setup'); return; }
  try {
    const res  = await fetch(GAS_URL + '?action=status&token=' + getToken());
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    if (json.hasOpenTrip) {
      currentTrip = json;
      buildTripInfo();
      startLocationAcquisition();
      show('end');
      startStopWatch();
    } else {
      currentTrip = null;
      resetStart();
      show('start');
    }
  } catch(e) {
    toast('接続エラー: ' + e.message);
    show('setup');
  }
}

function saveSetup() {
  const token = document.getElementById('input-token').value.trim();
  if (!token) { toast('トークンを入力してください'); return; }
  localStorage.setItem(TOKEN_KEY, token);
  init();
}

// ---- 乗車画面 ----
function buildStartInfo() {
  const now = new Date();
  const timeStr = now.toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
  document.getElementById('start-info').innerHTML =
    '<span style="font-size:1rem;font-weight:500;">' + timeStr + '</span>' +
    '　<span id="start-address" style="font-size:0.9375rem;color:var(--text2);">取得中...</span>';
  if (locationPromise) {
    locationPromise.then(loc => {
      const el = document.getElementById('start-address');
      if (el) el.textContent = loc.address || '';
    });
  }
}

function resetStart() {
  selectedPurpose  = '';
  photoBase64Start = '';
  document.querySelectorAll('.purpose-btn').forEach(b => {
    b.classList.remove('selected');
    b.disabled = false;
    b.textContent = b.dataset.label || b.textContent;
  });
  document.getElementById('purpose-btns').style.display = 'block';
  const prev = document.getElementById('photo-preview-start');
  prev.src = '';
  document.getElementById('photo-wrap-start').style.display = 'none';
  document.getElementById('photo-tap-start').style.display = 'flex';
  startLocationAcquisition();
  buildStartInfo();
}

async function selectAndSubmit(btn, purpose) {
  if (!photoBase64Start) { toast('写真を撮影してください'); return; }
  document.querySelectorAll('#purpose-btns .purpose-btn').forEach(b => b.disabled = true);
  const origText = btn.textContent;
  btn.textContent = '送信中...';
  try {
    await doSubmitStart(purpose);
  } catch(e) {
    toast('エラー: ' + e.message);
    document.querySelectorAll('#purpose-btns .purpose-btn').forEach(b => b.disabled = false);
    btn.textContent = origText;
  }
}

function handlePhoto(input, previewId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX_W = 1024;
      const scale = img.width > MAX_W ? MAX_W / img.width : 1;
      const canvas = document.createElement('canvas');
      canvas.width  = Math.round(img.width  * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      processCanvas(canvas, previewId);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function processCanvas(canvas, previewId) {
  const b64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
  if (previewId === 'photo-preview-start') photoBase64Start = b64;
  else photoBase64End = b64;
  const prev = document.getElementById(previewId);
  prev.src = canvas.toDataURL('image/jpeg', 0.85);
  const target = previewId === 'photo-preview-start' ? 'start' : 'end';
  document.getElementById('photo-tap-' + target).style.display = 'none';
  document.getElementById('photo-wrap-' + target).style.display = 'block';
}

function retakePhoto(target) {
  if (target === 'start') photoBase64Start = '';
  else photoBase64End = '';
  const prev = document.getElementById('photo-preview-' + target);
  prev.src = '';
  document.getElementById('photo-wrap-' + target).style.display = 'none';
  document.getElementById('photo-tap-' + target).style.display = 'flex';
  openCamera(target);
}

async function getAddress(lat, lon) {
  if (!lat || !lon) return '';
  try {
    const res = await fetch(
      'https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lon + '&format=json&accept-language=ja',
      { headers: { 'Accept-Language': 'ja' } }
    );
    const json = await res.json();
    return formatAddress(json.address || {});
  } catch(e) {
    return '';
  }
}

function formatAddress(address) {
  const locality = address.city || address.town || address.village || address.county || '';
  const district = address.city_district || address.suburb || address.neighbourhood || address.quarter || '';
  const road = address.road || '';
  const roadMatch = road.match(/.+?[0-9]+\u4e01\u76ee/u);
  const roadShort = roadMatch ? roadMatch[0] : '';
  const parts = [locality];

  [district, roadShort].forEach(part => {
    if (part && !parts.includes(part)) parts.push(part);
  });

  return parts.join('');
}

async function doSubmitStart(purpose) {
  const loc = await locationPromise;
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({
      token: getToken(), type: 'start',
      datetime: new Date().toISOString(),
      lat: loc.lat, lon: loc.lon, address: loc.address,
      purpose: purpose,
      photo: photoBase64Start
    })
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.error);
  toast('乗車記録完了');
  setTimeout(init, 2000);
}

// ---- 降車画面 ----
function buildTripInfo() {
  const t = currentTrip;
  const startTime = t.startDatetime
    ? new Date(t.startDatetime).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
    : '';
  const address = t.startAddress ? '　<span style="color:var(--text2);">' + t.startAddress + '</span>' : '';
  document.getElementById('trip-info').innerHTML =
    '<span style="font-size:1rem;font-weight:500;">' + startTime + '</span>' + address;
}

async function submitEnd() {
  if (!photoBase64End) { toast('写真を撮影してください'); return; }

  const btn = document.querySelector('#screen-end .btn-red');
  btn.disabled = true; btn.textContent = '位置情報取得中...';

  const loc = await locationPromise;
  btn.textContent = '送信中...';
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        token: getToken(), type: 'end',
        tripId: currentTrip.tripId,
        datetime: new Date().toISOString(),
        lat: loc.lat, lon: loc.lon, address: loc.address,
        photo: photoBase64End
      })
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    stopStopWatch();
    toast('降車記録完了');
    setTimeout(init, 2000);
  } catch(e) {
    toast('エラー: ' + e.message);
    btn.disabled = false; btn.textContent = '降車記録';
  }
}

// ---- 起動 ----
init();
</script>
